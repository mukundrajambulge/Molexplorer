<!DOCTYPE html>
<html>
<head>
<script src="https://3dmol.csb.pitt.edu/build/3Dmol.js"></script>
</head>
<body>
<div id="container" style="width: 400px; height: 400px; position: relative;"></div>
<script>
const viewer = $3Dmol.createViewer("container");
$3Dmol.download("pdb:1HVR", viewer, {doAssembly:false}, function() {
  const m = viewer.getModel(0);
  const atoms = m.selectedAtoms({});
  
  atoms.forEach(a => {
     if (a.resi >= 1 && a.resi <= 20) a.ss = 'h';
     else if (a.resi >= 21 && a.resi <= 40) a.ss = 's';
     else a.ss = 'c';
  });
  
  viewer.setStyle({}, { cartoon: { 
      colorfunc: (a) => {
          if (a.ss === 'h') return 'blue';
          if (a.ss === 's') return 'orange';
          return 'gray';
      }
  } });
  viewer.render();
  setTimeout(() => {
    console.log("Rendered!");
  }, 1000);
});
</script>
</body>
</html>
