relationships:
  hierarchy:
    - "SourceArtifact --(deterministically parses to)--> Molecule"
    - "Object --(references)--> Molecule"
    - "Object --(owns)--> State(s)"
    - "Molecule --(contains)--> Chain(s)"
    - "Chain --(contains)--> Residue(s)"
    - "Residue --(references)--> Atom(s)"
    - "Molecule --(contains)--> Bond(s)"
    - "Bond --(references)--> Atom(s) by canonical_id"

alternate_locations:
  policy: "Disordered conformers represented within one topological graph"
  rules:
    - rule_id: DM-A001
      description: "Alternate location atoms are stored as distinct elements in the single Molecule graph, with their `altLoc` field populated ('A', 'B', etc.)."
    - rule_id: DM-A002
      description: "Covalent bonding constraints: Atoms with altLoc 'A' may bond to atoms with altLoc 'A' or blank ' '. They must never bond to atoms with altLoc 'B' or other disjoint conformer sets."
    - rule_id: DM-A003
      description: "Active conformer selection: Calculations and visualization adapters may filter the graph to isolate a single active conformer (e.g. default to 'A' or '1' if altLoc is present)."

multi_state:
  status_distinction:
    CURRENT_IMPLEMENTATION:
      status: "IMPLEMENTED"
      description: "Single-model flat coordinate storage in MolProcessor.atoms and store/index.ts:processedPDB. Multi-model PDB files are parsed with first model active or biological assembly matrices parsed separately."
    SPECIFIED_FUTURE_MODEL:
      status: "SPECIFIED"
      description: "State-invariant topology container where the base Molecule topology graph (atoms, canonical_ids, covalent bonds) is shared across N State instances, with each State holding an independent Float64 Cartesian coordinate array [(x, y, z)_1, ..., (x, y, z)_N], per-state derived properties (DSSP, SASA, dipole), and per-state measurements."
    NOT_YET_IMPLEMENTED:
      status: "NOT_YET_IMPLEMENTED"
      description: "Multi-state trajectory animation playback, conformational ensemble averaging, state-specific topology mutations, and NMR constraint distance checking."

viewer_boundary:
  policy: "Strict physical state isolation"
  viewer_only_fields:
    - "Camera matrices (view, projection, rotation)"
    - "Display representations (Cartoon, Stick, Spheres, Surface)"
    - "Coloring scheme (CPK, spectrum, monochrome)"
    - "Opacity and lighting parameters"
    - "Object visibility flags"
    - "WebGL handles, meshes, and textures"
  allowed_flow_direction: "Scientific State -> Viewer Adapter -> WebGL Canvas"
  interaction_policy: "Viewer events (clicking, dragging) generate commands which are processed and committed by the Scientific Core; the viewer updates only after a new state revision is emitted."

validation:
  scientific_audit_matrix:
    - concept: "Coordinate Finiteness"
      requirement: "Coordinates must be finite numbers; no NaN, null, +Inf, -Inf."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / SOFTWARE VERIFIED"
      evidence: "src/lib/MolProcessor.ts:95-97, scratch/test_phase4_pse_session.ts"
    - concept: "Coordinate System Units"
      requirement: "Spatial metric must strictly be Ångströms (Å)."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / SOFTWARE VERIFIED"
      evidence: "src/lib/MolProcessor.ts, scratch/qa_group1_small_molecules.ts"
    - concept: "Stable Atom Serials"
      requirement: "Atom serial numbers and array indices must remain consistent during read operations."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / SOFTWARE VERIFIED"
      evidence: "src/lib/MolProcessor.ts:33, scratch/test_phase4_pse_session.ts"
    - concept: "Bond Reference Integrity"
      requirement: "Every bond endpoint must resolve to an existing atom in the same model."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / SOFTWARE VERIFIED"
      evidence: "src/lib/MolProcessor.ts:700-740, scratch/qa_group1_small_molecules.ts"
    - concept: "Source Immutability"
      requirement: "Raw PDB/mmCIF string/buffer must never be mutated in place."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / SOFTWARE VERIFIED"
      evidence: "src/store/index.ts, scratch/test_phase4_pse_session.ts"
    - concept: "Topology Change Explicitness"
      requirement: "Bond additions/removals occur only via explicit domain operations."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / NOT SCIENTIFICALLY BENCHMARKED"
      evidence: "src/editor/TopologyEditor.ts:7-35 (interactive editing implemented; formal stress validation pending)"
    - concept: "Viewer Decoupling"
      requirement: "Camera rotation, zoom, coloring, and style changes never alter atomic coordinates or chemistry."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / SOFTWARE VERIFIED"
      evidence: "src/components/CoreViewer3D.tsx, scratch/test_phase4_e2e_pse.cjs"
    - concept: "Multi-Conformer Disjointness"
      requirement: "Alternate location conformers must not be bonded across disjoint conformer sets."
      implementation_status: "PARTIAL"
      validation_status: "PARTIAL / NOT YET VALIDATED"
      evidence: "src/lib/MolProcessor.ts:350-380 (basic altloc filtering implemented; multi-conformer graph unvalidated)"
    - concept: "Valency Bounds"
      requirement: "Atom covalent valencies must not exceed physically allowable maximums."
      implementation_status: "PARTIAL"
      validation_status: "PARTIAL / NOT YET VALIDATED"
      evidence: "src/editor/TopologyEditor.ts:48 (standard valency lookup implemented; full quantum/hybridization unvalidated)"
    - concept: "DSSP Secondary Structure"
      requirement: "Hydrogen-bond energy calculation and pattern recognition must assign standard secondary structure."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / SCIENTIFICALLY BENCHMARKED"
      evidence: "docs/reports/validate_dssp_dihedrals.md (benchmarked against Kabsch-Sander 1983 reference values)"
    - concept: "Kabsch Alignment & RMSD"
      requirement: "SVD decomposition and rotation matrix calculation must yield optimal alignment (det(R)=+1)."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / SCIENTIFICALLY BENCHMARKED"
      evidence: "docs/reports/validate_dipole_kabsch.md (benchmarked against Kabsch 1976 algorithm)"
    - concept: "Dipole Moment Calculation"
      requirement: "Molecular dipole moment magnitude and vector calculated from partial charges."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / NOT SCIENTIFICALLY BENCHMARKED"
      evidence: "docs/reports/validate_dipole_kabsch.md (geometric Debye 1912 formulation implemented; quantum benchmarking pending)"
    - concept: "Non-Covalent Interactions"
      requirement: "Geometric detection of hydrogen bonds, salt bridges, pi-stacking, cation-pi, halogen bonds."
      implementation_status: "IMPLEMENTED"
      validation_status: "IMPLEMENTED / NOT SCIENTIFICALLY BENCHMARKED"
      evidence: "src/lib/Interactions.ts (geometric criteria implemented; experimental affinity benchmark pending)"
    - concept: "Multi-State Topology Invariance"
      requirement: "Multi-model ensembles must share identical atom topologies across all states."
      implementation_status: "NOT_YET_IMPLEMENTED"
      validation_status: "NOT YET IMPLEMENTED"
      evidence: "Multi-state coordinate container deferred to future data model milestone"

  rules:
    - rule_id: DM-V001
      entity: "Atom"
      severity: MUST
      condition: "Coordinates must be finite Float64 numbers."
      failure_behavior: "Raise CoordinateSanityError; abort operation."
      test_requirement: "Unit test parsing coordinate strings containing NaN, Inf, or empty values."
    
    - rule_id: DM-V002
      entity: "Atom"
      severity: SHOULD
      condition: "Occupancy must fall in range [0.0, 1.0]."
      failure_behavior: "Issue occupancy warning; clip to range if forced, otherwise retain."
      test_requirement: "Parser warnings test with occupancy 1.2."

    - rule_id: DM-V003
      entity: "Bond"
      severity: MUST
      condition: "endpoints exist in Molecule atoms."
      failure_behavior: "Raise TopologyConsistencyError; abort operation."
      test_requirement: "TopologyEditor addBond test with invalid index."

    - rule_id: DM-V004
      entity: "Bond"
      severity: MUST
      condition: "No self-bonds allowed."
      failure_behavior: "Raise TopologyConsistencyError; abort."
      test_requirement: "TopologyEditor addBond test with same atom A and B."

    - rule_id: DM-V005
      entity: "Bond"
      severity: SHOULD
      condition: "Distance between bonded atoms must satisfy 0.4 Å <= d <= 4.0 Å."
      failure_behavior: "Issue physical distance warning."
      test_requirement: "Structure verification check with stretched bonds."

    - rule_id: DM-V006
      entity: "Residue"
      severity: MUST
      condition: "Standard residues must contain CA/P guide atoms."
      failure_behavior: "Mark secondary structure as undetermined."
      test_requirement: "DSSP calculation with missing CA atoms."

    - rule_id: DM-V007
      entity: "State"
      severity: MUST
      condition: "Length of coordinate array must match atom count of parent topology."
      failure_behavior: "Raise StateCoordinateMismatchError; abort."
      test_requirement: "NMR model parsing with varying atom counts."

