open_decisions:
  - decision_id: OD-001
    question: "What is the optimal Canonical Atom Identifier scheme?"
    status: "PROPOSED"
    owner: "Lead Scientific Architect"
    current_repository_behavior: "Parser uses PDB serial; topology editor uses array index; session uses serial; store uses serial."
    scientific_options:
      - "Option A: 1-based sequential integer assigned on load (retained on edits with tombstoned deletions)."
      - "Option B: Cryptographically random UUID string."
      - "Option C: Alphanumeric composite key (chain:resi:name:altloc)."
    advantages:
      Option A: "Extremely fast array lookups, small memory footprint, simple serialization mapping."
      Option B: "Guaranteed absolute uniqueness across separate files, workspaces, and merges."
      Option C: "Directly human-readable and chemically intuitive."
    risks:
      Option A: "Requires keeping a tombstone list of deleted IDs to prevent collisions when adding atoms."
      Option B: "Significantly increases JSON session file sizes and decreases numeric processing performance."
      Option C: "Fails when chain renames, residue renumbering, or structural mutations occur."
    compatibility_impact: "Dictates selection store representation, measurement endpoints, and transaction validation."
    recommended_option: "Option A: Stable sequential integers assigned on load, tracking deleted IDs to avoid collisions."
    evidence_required: "Stress test with multiple atom deletion and insertion cycles in the topology editor."
    decision_gate: "P1 Canonical Molecular Data Model Implementation Gate"

  - decision_id: OD-002
    question: "How should alternate location coordinate disorder (altLoc) be represented?"
    status: "PROPOSED"
    owner: "Lead Scientific Architect"
    current_repository_behavior: "MolProcessor filters out all altLocs except blank, 'A', or '1' on load."
    scientific_options:
      - "Option A: Separate atoms in a single topology graph with altLoc tags."
      - "Option B: Multiple alternate coordinate states in a multi-state container."
      - "Option C: Disjoint bond graphs."
    advantages:
      Option A: "Keeps a single Molecule graph structure, compatible with standard flat representation."
      Option B: "Physically clean; represents alternate conformations as parallel states."
      Option C: "Maintains chemical valency correctness for disjoint configurations."
    risks:
      Option A: "Can trigger valency warnings if bond detection ignores altLoc identities."
      Option B: "Increases coordinate state management complexity."
      Option C: "Substantially complicates selection query and parser execution."
    compatibility_impact: "Critical for high-resolution crystallographic structure analysis and modeling."
    recommended_option: "Option A: Separate atoms in a single graph paired with strict bond disjointness rules (atoms of altLoc A do not bond to altLoc B)."
    evidence_required: "Test connectivity graphs of multi-conformer structures such as 1CRN and 4HHB."
    decision_gate: "P1 Canonical Molecular Data Model Implementation Gate"

  - decision_id: OD-003
    question: "How should aromatic bonds and aromaticity be represented in the topology graph?"
    status: "PROPOSED"
    owner: "Lead Scientific Architect"
    current_repository_behavior: "Parser accepts double bonds; SDF uses aromatic order; internal bonds list is integer array."
    scientific_options:
      - "Option A: Localized Kekulé structures (alternating single and double bonds) plus is_aromatic flag."
      - "Option B: Delocalized aromatic bond orders (1.5) plus is_aromatic flag."
      - "Option C: Dual representation (Kekule orders stored with aromatic ring perception metadata)."
    advantages:
      Option A: "Standard chemical valence checking is straightforward."
      Option B: "Avoids artificial symmetry breaking and coordinates directly with RDKit aromatic descriptors."
      Option C: "Provides maximum interoperability between PDB (Kekule) and SDF/Mol2 (delocalized)."
    risks:
      Option A: "Requires aromaticity perception algorithm to alternate single/double bonds deterministically."
      Option B: "Requires supporting float-based bond orders in algorithms and schemas."
      Option C: "Increases memory and validation synchronization overhead."
    compatibility_impact: "Affects valency bounds checks, hydrogen addition, and force-field parameterizations."
    recommended_option: "Option C: Dual representation decoupling numeric bond order from the is_aromatic topological flag."
    evidence_required: "Validate SDF/PDB round-trip calculations for ligand structures with complex heterocyclic aromatic systems."
    decision_gate: "P4 Bond Topology Editing Gate"

  - decision_id: OD-004
    question: "Which algorithm should classify nucleic-acid secondary structure?"
    status: "PROPOSED"
    owner: "Lead Scientific Architect"
    current_repository_behavior: "None; secondary structure calculation only supports proteinogenic residues via DSSP/Quick."
    scientific_options:
      - "Option A: Simple base-pair distance-based classification."
      - "Option B: Full 3DNA/DSSR matrix criteria."
    advantages:
      Option A: "Fast, simple, client-side execution."
      Option B: "Highly accurate and standard in structural biology."
    risks:
      Option A: "Prone to false positives in distorted structures."
      Option B: "Requires porting complex geometric code to TypeScript."
    compatibility_impact: "Secondary structure representation of DNA/RNA cartoon models."
    recommended_option: "Option A: Geometric distance/angle classification on the client, with hooks to integrate DSSP/3DNA results from the backend."
