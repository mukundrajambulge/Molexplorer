metadata:
  specification_id: "MOLEXPLORER-DATA-MODEL"
  specification_name: "Canonical Molecular Data Model Specification"
  version: "1.0"
  status: "PROPOSED"
  effective_date: "2026-08-21"
  repository: "mukundrajambulge/Molexplorer"
  branch: "dev"
  audience: "Computational Biophysicists, Bioinformaticians, Software Architects, and Autonomous Coding Agents"
  authority: "Molexplorer Project Owner & Lead Scientific Architect"
  supersedes: "None"
  related_documents:
    - "MASTER_PLAN.md"
    - "AGENTS.md"
    - "docs/science/SCIENTIFIC_FOUNDATION.md"

governance:
  rules:
    - rule_id: DM-G001
      severity: MUST
      statement: "The scientific domain shall use exactly one canonical molecular data model."
      rationale: "Prevents divergent data structures and incompatible states across parsing, selection, editing, and visualization modules."
      applies_to:
        - frontend
        - scientific-core
        - persistence
        - API
      validation_requirement:
        - "Code audit must verify no duplicate or parallel atom/bond models are active."
    
    - rule_id: DM-G002
      severity: MUST
      statement: "Raw source molecular data artifacts are treated as immutable ground truth."
      rationale: "Maintains reproducibility and auditability of scientific calculations and docking runs."
      applies_to:
        - scientific-core
        - persistence
      validation_requirement:
        - "Raw string or byte payloads must be hashed (SHA-256) and preserved without alteration."

    - rule_id: DM-G003
      severity: MUST
      statement: "Every scientific mutation or editing operation must create a derived state revision."
      rationale: "Ensures non-destructive edits, multi-level undo/redo capabilities, and full lineage tracking."
      applies_to:
        - scientific-core
        - editor
      validation_requirement:
        - "Operation commits must generate a new revision object referencing its parent ID."

    - rule_id: DM-G004
      severity: MUST
      statement: "The WebGL/3D viewer is strictly a downstream observer and cannot hold authoritative state."
      rationale: "Prevents lossy round-tripping through presentation structures and WebGL buffers."
      applies_to:
        - components
        - renderer
      validation_requirement:
        - "The rendering adapter must receive unidirectional data flow from the canonical scientific model."

    - rule_id: DM-G005
      severity: MUST
      statement: "All coordinate positions must be finite numbers in Ångströms."
      rationale: "Prevents mathematical overflows, NaN propagation, and ensures physical consistency across algorithms."
      applies_to:
        - scientific-core
        - parser
      validation_requirement:
        - "Coordinates must be checked for finite floats (no NaN, Inf, or nulls allowed)."

    - rule_id: DM-G006
      severity: MUST
      statement: "The chemical bonding topology must be modeled as an explicit, validated graph."
      rationale: "Covalent linkages dictate molecular identity, valency limits, and structural edit operations."
      applies_to:
        - scientific-core
        - editor
      validation_requirement:
        - "Graph edge endpoint integrity and lack of self-bonds must be validated upon modification."

    - rule_id: DM-G007
      severity: MUST
      statement: "Selection resolution must be based on canonical atom identifiers, not array indexes."
      rationale: "Array indices shift during deletion/insertion edits, rendering index-based selections invalid."
      applies_to:
        - scientific-core
        - selection-engine
      validation_requirement:
        - "Selections must return sets of canonical atom IDs that persist across structural mutations."

    - rule_id: DM-G008
      severity: MUST
      statement: "Parsing and chemical normalizations must be bitwise-deterministic."
      rationale: "Ensures identical input payloads yield identical scientific analyses, selections, and models."
      applies_to:
        - parser
        - normalization
      validation_requirement:
        - "A golden parsing fixture must produce identical canonical models across all runs."

    - rule_id: DM-G009
      severity: MUST
      statement: "All scientific operations must fail closed on invalid, malformed, or physical-violating states."
      rationale: "Prevents silent data corruption or heuristic guesswork that compromises physical reality."
      applies_to:
        - scientific-core
        - editor
      validation_requirement:
        - "Errors must be explicitly raised and transactions rolled back; no silent recovery."

    - rule_id: DM-G010
      severity: SHOULD
      statement: "No scientific state metadata, conformer, alternate location, or chemical property shall be silently dropped."
      rationale: "Crystallographic disorder, isotropic B-factors, and formal charges are vital biophysical records."
      applies_to:
        - parser
        - persistence
      validation_requirement:
        - "Unrecognized PDB or mmCIF records must be retained in an associated warnings/remarks structure."

units:
  coordinates:
    unit: "angstrom"
    symbol: "Å"
    scale_to_si: 1e-10
  distance:
    unit: "angstrom"
    symbol: "Å"
    scale_to_si: 1e-10
  angles:
    unit: "degree"
    symbol: "°"
    radians_allowed_internal: "Allowed for internal trigonometric computations only; must expose and serialize in degrees."
  charges:
    unit: "elementary_charge"
    symbol: "e"
    scale_to_si: 1.602176634e-19
  dipole:
    unit: "Debye"
    symbol: "D"
    scale_to_si: 3.33564e-30
  energy:
    unit: "kilocalorie_per_mole"
    symbol: "kcal/mol"
    status: "DEFINED"
    rationale: "Used for DSSP hydrogen-bond electrostatics (E = q1 * q2 * f * (1/r_ON + 1/r_CH - 1/r_OH - 1/r_CN), with f = 332) yielding energy in kcal/mol."

identity:
  evaluation:
    pdb_serial:
      description: "1-based integer from source ATOM/HETATM records."
      pros: "Matches source file formatting exactly, simplifies direct export round-trip."
      cons: "Non-consecutive, duplicate across models, missing in generated files, shifts on edits."
    array_index:
      description: "0-based array index in memory."
      pros: "Fast lookups, simple implementation in memory arrays."
      cons: "Shifts whenever atoms are deleted or inserted, breaking selections, measurements, and bonds."
    composite_identity:
      description: "String key of format: chainID:resSeq:iCode:name:altLoc."
      pros: "Chemically meaningful and unique for standard static structures."
      cons: "Extremely fragile during structural edits like renaming, renumbering, or deleting altLocs."
    generated_uuid:
      description: "Cryptographically random unique identifier."
      pros: "Perfect stability across all deletion, insertion, and revision operations."
      cons: "Higher memory overhead, non-readable, complicates standard numeric matrix math."

  resolution:
    canonical_id:
      type: "integer"
      format: "positive non-zero sequential (1-indexed)"
      stability: "STABLE_WITHIN_REVISION"
      scope: "Molecule"
      generation_rule: "Assigned sequentially starting at 1 when molecule is loaded. Revisions maintain mapping."
      collision_rule: "Never reuse a deleted canonical_id within the same revision lineage. Added atoms receive new, strictly increasing IDs."
      persistence_rule: "Serialized in PSE and transient selections to ensure reference integrity."
      export_mapping: "Mapped back to sequential PDB serials on export. If ID exceeds 99999, output using hybrid-36 or hexadecimal format."

entities:
  SourceArtifact:
    classification: "CANONICAL"
    description: "Byte-for-byte representation of the raw input file."
    properties:
      id: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      source_type: { type: "string", enum: ["pdb", "mmcif", "mmtf", "sdf", "mol2", "generated"], classification: "CANONICAL", mutable: false }
      original_name: { type: "string", classification: "CANONICAL", mutable: false }
      media_type: { type: "string", classification: "CANONICAL", mutable: false }
      raw_content: { type: "string_or_binary", classification: "CANONICAL", mutable: false }
      hash: { type: "string", format: "sha-256", classification: "CANONICAL", mutable: false }
      imported_at: { type: "integer", format: "epoch_ms", classification: "CANONICAL", mutable: false }
      source_reference: { type: "string", nullable: true, classification: "CANONICAL", mutable: false }
      provenance: { type: "object", classification: "CANONICAL", mutable: false }
    invariants:
      - "SourceArtifact is strictly immutable once written."

  MolecularDocument:
    classification: "CANONICAL"
    description: "The top-level workspace container containing objects, active states, and session metadata."
    properties:
      document_id: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      version: { type: "integer", classification: "CANONICAL", mutable: false }
      objects: { type: "array", items: "Object", classification: "CANONICAL", mutable: true }
      active_selections: { type: "array", items: "Selection", classification: "CANONICAL", mutable: true }
      session_metadata: { type: "object", classification: "CANONICAL", mutable: true }

  Molecule:
    classification: "CANONICAL"
    description: "The hierarchical chemical graph containing atoms, bonds, chains, and residues."
    properties:
      molecule_id: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      source_reference_id: { type: "string", format: "uuid", nullable: true, classification: "CANONICAL", mutable: false }
      chains: { type: "array", items: "Chain", classification: "CANONICAL", mutable: true }
      bonds: { type: "array", items: "Bond", classification: "CANONICAL", mutable: true }
      metadata: { type: "object", classification: "CANONICAL", mutable: true }
      classification: { type: "string", enum: ["protein", "nucleic", "ligand_complex", "mixture"], classification: "DERIVED", mutable: false }
    ownership:
      type: "identifier-based & nested"
      rules:
        - "Molecule owns Chain by-value (nested JSON structure)."
        - "Chain owns Residue by-value (nested JSON structure)."
        - "Residue owns Atom by-value (nested JSON structure)."
        - "Molecule owns Bond by-reference (bonds are stored flat at Molecule level and reference Atom canonical_ids)."

  Object:
    classification: "CANONICAL"
    description: "A named workspace reference to a Molecule, wrapping its states and visual settings."
    properties:
      object_id: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      name: { type: "string", classification: "CANONICAL", mutable: true }
      molecule_ref: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      states: { type: "array", items: "State", classification: "CANONICAL", mutable: true }
      visibility: { type: "boolean", classification: "VIEWER", mutable: true }
      object_metadata: { type: "object", classification: "CANONICAL", mutable: true }

  State:
    classification: "CANONICAL"
    description: "A single coordinate frame or conformational instance (e.g. NMR model, docking pose)."
    properties:
      state_id: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      state_index: { type: "integer", classification: "CANONICAL", mutable: false }
      coordinates: { type: "array", items: "float[3]", classification: "CANONICAL", mutable: true }
      topology_reference: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      parent_state_id: { type: "string", format: "uuid", nullable: true, classification: "CANONICAL", mutable: false }
      state_metadata: { type: "object", classification: "CANONICAL", mutable: true }
    topology_sharing:
      policy: "SHARED"
      statement: "Multiple states share the identical base topology graph (bonds and atoms) of the parent Molecule. Modifying coordinates changes State; modifying topology generates a new Molecule revision."

  Chain:
    classification: "CANONICAL"
    description: "A continuous polymer strand or standard group within a Molecule."
    properties:
      chain_id: { type: "string", classification: "CANONICAL", mutable: false }
      chain_name: { type: "string", classification: "CANONICAL", mutable: true }
      residues: { type: "array", items: "Residue", classification: "CANONICAL", mutable: true }
      ordering: { type: "array", items: "integer", classification: "CANONICAL", mutable: false }
      source_identifier: { type: "string", classification: "SOURCE", mutable: false }
      polymer_type: { type: "string", enum: ["protein", "nucleic", "solvent", "ion", "ligand", "other"], classification: "DERIVED", mutable: false }
    handling:
      blank_ids: "Represented as a single space character ' ' to maintain alignment with PDB fixed-width constraints."
      multi_character_ids: "Supported up to 4 characters for mmCIF compatibility."
      renaming: "Supported via explicit rename operation that updates residue chain_ref and creates a new revision."

  Residue:
    classification: "CANONICAL"
    description: "A chemically contiguous residue subunit (e.g. amino acid, nucleotide, water molecule)."
    properties:
      residue_id: { type: "integer", classification: "CANONICAL", mutable: false }
      resSeq: { type: "integer", classification: "CANONICAL", mutable: false }
      iCode: { type: "string", format: "character", classification: "CANONICAL", mutable: false }
      resName: { type: "string", classification: "CANONICAL", mutable: false }
      chain_ref: { type: "string", classification: "CANONICAL", mutable: false }
      atom_refs: { type: "array", items: "integer", classification: "CANONICAL", mutable: true }
      classification: { type: "string", enum: ["standard_amino_acid", "standard_nucleic_acid", "ligand", "water", "ion", "modified_residue", "unknown"], classification: "DERIVED", mutable: false }
    hierarchy:
      mutual_exclusivity: false
      statement: "A residue has a primary classification for parser logic, but can support secondary classification attributes (e.g., a modified_residue can also behave as a standard_amino_acid subclass)."

  Atom:
    classification: "CANONICAL"
    description: "Detailed properties and matrix for the fundamental chemical entity."
    properties:
      canonical_id:
        semantic_name: "Canonical Atom ID"
        type: "integer"
        required: true
        nullable: false
        source: false
        derived: false
        canonical: true
        mutable: false
        validation: "Must be positive, non-zero, unique in Molecule."
        serialization: "Required"
        export_mapping: "Sequential re-index on PDB export."
      source_serial:
        semantic_name: "Source Serial Number"
        type: "integer"
        required: false
        nullable: true
        source: true
        derived: false
        canonical: false
        mutable: false
        validation: "Inherited from file record."
        serialization: "Optional"
        export_mapping: "Preserved in REMARK headers or directly mapped if possible."
      element:
        semantic_name: "Element Symbol"
        type: "string"
        required: true
        nullable: false
        source: true
        derived: false
        canonical: true
        mutable: false
        validation: "Must be normalized uppercase IUPAC element symbol."
        serialization: "Required"
        export_mapping: "PDB columns 77-78."
      atomic_number:
        semantic_name: "Atomic Number"
        type: "integer"
        required: true
        nullable: false
        source: false
        derived: true
        canonical: true
        mutable: false
        validation: "Derived from element symbol."
        serialization: "Optional"
        export_mapping: "None"
      name:
        semantic_name: "Atom Name"
        type: "string"
        required: true
        nullable: false
        source: true
        derived: false
        canonical: true
        mutable: false
        validation: "Standard PDB name format, padded/trimmed."
        serialization: "Required"
        export_mapping: "PDB columns 13-16."
      normalized_name:
        semantic_name: "Normalized Atom Name"
        type: "string"
        required: true
        nullable: false
        source: false
        derived: true
        canonical: true
        mutable: false
        validation: "Standardized naming convention (e.g., CA, N, O)."
        serialization: "Optional"
        export_mapping: "None"
      position:
        semantic_name: "Cartesian Position"
        type: "float[3]"
        unit: "angstrom"
        required: true
        nullable: false
        source: true
        derived: false
        canonical: true
        mutable: true
        validation: "Must be finite Float64 values."
        serialization: "Required"
        export_mapping: "PDB columns 31-54."
      residue_ref:
        semantic_name: "Parent Residue ID"
        type: "integer"
        required: true
        nullable: false
        source: false
        derived: false
        canonical: true
        mutable: false
        validation: "Must match a valid Residue ID in the Molecule."
        serialization: "Required"
        export_mapping: "Used to build resSeq columns."
      chain_ref:
        semantic_name: "Parent Chain ID"
        type: "string"
        required: true
        nullable: false
        source: false
        derived: false
        canonical: true
        mutable: false
        validation: "Must match parent Chain ID."
        serialization: "Required"
        export_mapping: "PDB column 22."
      molecule_ref:
        semantic_name: "Parent Molecule ID"
        type: "string"
        required: true
        nullable: false
        source: false
        derived: false
        canonical: true
        mutable: false
        validation: "Must match parent Molecule ID."
        serialization: "Required"
        export_mapping: "None"
      is_hetero:
        semantic_name: "HETATM Flag"
        type: "boolean"
        required: true
        nullable: false
        source: true
        derived: false
        canonical: true
        mutable: false
        validation: "True for ligand/solvent/ion; False for polymer."
        serialization: "Required"
        export_mapping: "Record type ATOM vs HETATM."
      occupancy:
        semantic_name: "Occupancy"
        type: "float"
        required: false
        nullable: true
        source: true
        derived: false
        canonical: true
        mutable: true
        validation: "Must be between 0.0 and 1.0 inclusive."
        serialization: "Required"
        export_mapping: "PDB columns 55-60."
      b_factor:
        semantic_name: "B-Factor"
        type: "float"
        unit: "angstrom^2"
        required: false
        nullable: true
        source: true
        derived: false
        canonical: true
        mutable: true
        validation: "Must be non-negative."
        serialization: "Required"
        export_mapping: "PDB columns 61-66."
      alt_loc:
        semantic_name: "Alternate Location Indicator"
        type: "string"
        required: false
        nullable: true
        source: true
        derived: false
        canonical: true
        mutable: false
        validation: "Single character identifier or blank."
        serialization: "Required"
        export_mapping: "PDB column 17."
      formal_charge:
        semantic_name: "Formal Charge"
        type: "integer"
        unit: "elementary_charge"
        required: false
        nullable: true
        source: true
        derived: false
        canonical: true
        mutable: true
        validation: "Must be integer between -8 and +8."
        serialization: "Required"
        export_mapping: "PDB columns 79-80."
      partial_charge:
        semantic_name: "Electrostatic Partial Charge"
        type: "float"
        unit: "elementary_charge"
        required: false
        nullable: true
        source: false
        derived: true
        canonical: false
        mutable: true
        validation: "Computed charge value."
        serialization: "Optional"
        export_mapping: "MOL2/SDF charges."
      isotope:
        semantic_name: "Isotope Mass Number"
        type: "integer"
        required: false
        nullable: true
        source: true
        derived: false
        canonical: true
        mutable: false
        validation: "Must be positive integer."
        serialization: "Optional"
        export_mapping: "SDF isotope field."
      modeled_hydrogen:
        semantic_name: "Modeled Hydrogen Flag"
        type: "boolean"
        required: false
        nullable: false
        source: false
        derived: true
        canonical: false
        mutable: false
        validation: "True if placed computationally; False if experimental."
        serialization: "Required"
        export_mapping: "Flagged via B-factor 99.90 in standard exports."
      secondary_structure:
        semantic_name: "Secondary Structure Class"
        type: "string"
        required: false
        nullable: true
        source: false
        derived: true
        canonical: false
        mutable: true
        validation: "helix, sheet, or loop."
        serialization: "Required"
        export_mapping: "PDB HELIX/SHEET records."

  Bond:
    classification: "CANONICAL"
    description: "Covalent linkage between two atoms."
    properties:
      bond_id: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      atom_a: { type: "integer", classification: "CANONICAL", mutable: false }
      atom_b: { type: "integer", classification: "CANONICAL", mutable: false }
      order: { type: "float", enum: [1, 1.5, 2, 3], classification: "CANONICAL", mutable: true }
      is_aromatic: { type: "boolean", classification: "CANONICAL", mutable: true }
      source: { type: "string", enum: ["file", "inferred", "editor"], classification: "CANONICAL", mutable: false }
      confidence: { type: "float", classification: "DERIVED", mutable: true }
      provenance: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      is_inferred: { type: "boolean", classification: "DERIVED", mutable: false }
    aromaticity_semantics:
      distinction: "Bond order (numeric multiplicity) and Aromaticity (conjugated cyclic electronic property) are explicitly distinct."
      bond_order_field: "order (1, 1.5, 2, 3)"
      aromatic_flag_field: "is_aromatic (boolean)"
      delocalized_order_value: 1.5
      policy: "An aromatic ring may be represented using delocalized 1.5 bond orders OR localized Kekule 1/2 alternating orders; in both cases, the is_aromatic flag remains true for the participating bonds and ring atoms."
    invariants:
      duplicate_bonds: "Disallowed; at most one edge between any unordered pair (atom_a, atom_b)."
      self_bonding: "Disallowed; atom_a must not equal atom_b."
      invalid_endpoints: "Disallowed; endpoints must refer to valid canonical_ids."

  Selection:
    classification: "CANONICAL"
    description: "A named or transient selection of atoms."
    properties:
      selection_id: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      expression: { type: "string", classification: "CANONICAL", mutable: false }
      normalized_expression: { type: "string", classification: "CANONICAL", mutable: false }
      AST_reference: { type: "object", classification: "CANONICAL", mutable: false }
      resolved_atom_ids: { type: "array", items: "integer", classification: "CANONICAL", mutable: true }
      scope: { type: "string", enum: ["molecule", "object", "workspace"], classification: "CANONICAL", mutable: false }
      created_at: { type: "integer", format: "epoch_ms", classification: "CANONICAL", mutable: false }
      parent_revision: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      determinism: { type: "boolean", classification: "CANONICAL", mutable: false }
    resolution_semantics:
      runtime_selection_cache:
        classification: "TRANSIENT"
        type: "Set<integer>"
        description: "In-memory set of canonical atom IDs evaluated dynamically for high-frequency viewport interactions and hover highlighting."
      canonical_selection_semantics:
        classification: "CANONICAL"
        type: "AST / Expression"
        description: "The mathematical and logical AST definition (e.g. byres (resn LIG around 5.0)) defining the deterministic query."
      persisted_selection_resolution:
        classification: "SERIALIZED / PERSISTED"
        type: "Array<integer>"
        description: "The resolved canonical atom ID array stored in .PSE session envelopes or Provenance records to guarantee exact historical state restoration across sessions and mutations."

  CustomProperties:
    classification: "LAYERED"
    description: "Classification schema for arbitrary metadata and custom properties."
    tiers:
      SOURCE:
        description: "Properties parsed directly from source file headers and auxiliary records (e.g. REMARK 350 matrices, SDF custom data fields, mmCIF categories)."
        storage: "Stored under Molecule.metadata.source_records or Atom.source_properties; immutable."
      CANONICAL:
        description: "Properties that define or alter core physical/chemical identity in the domain model."
        storage: "Stored as explicit top-level fields on domain entities; mutable only via validated revisions."
      DERIVED:
        description: "Computed biophysical metrics (e.g. Gasteiger partial charges, DSSP secondary structure, SASA, dipole moment)."
        storage: "Stored in DerivedProperty records or cached on domain entities with source_revision references."
      PERSISTENT_USER_METADATA:
        description: "User-defined labels, custom annotations, workspace grouping tags, and color overrides."
        storage: "Serialized in .PSE session envelopes under metadata and object_metadata."
      TRANSIENT:
        description: "Ephemeral runtime states (e.g. UI hover states, active measurement click buffers, WebGL pick caches)."
        storage: "Held in volatile frontend store; never serialized."

  Measurement:
    classification: "DERIVED"
    description: "A derived biophysical metric calculated on specific atoms."
    properties:
      id: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      type: { type: "string", enum: ["distance", "angle", "dihedral", "label"], classification: "CANONICAL", mutable: false }
      atom_ids: { type: "array", items: "integer", classification: "CANONICAL", mutable: false }
      source_revision: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      algorithm: { type: "string", classification: "DERIVED", mutable: false }
      numerical_result: { type: "float", classification: "DERIVED", mutable: false }
      units: { type: "string", classification: "DERIVED", mutable: false }
    invariants:
      mutability: "Measurements must never mutate molecular state."

  DerivedProperty:
    classification: "DERIVED"
    description: "A calculated biophysical property associated with a structure."
    properties:
      property_id: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      source_revision: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      algorithm: { type: "string", classification: "DERIVED", mutable: false }
      parameters: { type: "object", classification: "DERIVED", mutable: false }
      output_type: { type: "string", classification: "DERIVED", mutable: false }
      units: { type: "string", classification: "DERIVED", mutable: false }
      version: { type: "string", classification: "DERIVED", mutable: false }
      validity: { type: "boolean", classification: "DERIVED", mutable: true }

  ScientificRevision:
    classification: "CANONICAL"
    description: "Record of a scientific state transformation."
    properties:
      revision_id: { type: "string", format: "uuid", classification: "CANONICAL", mutable: false }
      parent_revision_id: { type: "string", format: "uuid", nullable: true, classification: "CANONICAL", mutable: false }
      operation: { type: "string", classification: "CANONICAL", mutable: false }
